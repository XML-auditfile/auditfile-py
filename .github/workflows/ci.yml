name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']
  # Also to run CI on a branch whose pull request was opened by a workflow (GITHUB_TOKEN events start no runs).
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same pull request or branch cancels the run that is still busy.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Fetch auditfile-spec (spec.lock.json)
        shell: pwsh
        run: ./tools/fetch-spec.ps1

      - name: Embed the spec
        run: python tools/embed_spec.py

      - name: Install
        run: pip install -e ".[test]"

      - name: Test
        run: pytest

  # The one check the branch rules require, whatever the jobs above: it fails when any of them did not succeed.
  ci-passed:
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do [ "$result" = success ] || exit 1; done
