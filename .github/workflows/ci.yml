name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Fetch auditfile-spec (spec.lock.json)
        shell: pwsh
        run: ./tools/fetch-spec.ps1

      - name: Embed the spec
        run: python tools/embed_spec.py

      - name: Install
        run: pip install -e ".[test]"

      - name: Test
        run: pytest
